<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Project GPA Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #abbaff, #bc7afe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .btn-primary {
            width: 100%;
        }
        .result-box {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">

                <h2 class="text-center mb-4">GPA Prediction</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Reading Hours</label>
                        <input type="number" step="0.1" class="form-control" name="reading_hours" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Attendance Rate (%)</label>
                        <input type="number" step="0.1" class="form-control" name="attendance_rate" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Late Submission Rate (%)</label>
                        <input type="number" step="0.1" class="form-control" name="late_submission_rate" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Midterm Score (%)</label>
                        <input type="number" step="0.1" class="form-control" name="midterm_score" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Predict GPA</button>
                </form>

                {% if prediction is not none %}
                <div class="result-box mt-3">
                    <h4>Predicted GPA</h4>
                    <h2 class="text-success">{{ prediction|round(2) }}</h2>
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>

</body>
</html>
